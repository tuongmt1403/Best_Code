<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d3b">
  <title>Đăng nhập · Học Mà Chơi</title>
  <link rel="stylesheet" href="/dangKy_dangNhap/auth.css">
  <script src="/dangKy_dangNhap/client.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-scene">
    <div class="scene-orb orb-one" aria-hidden="true"></div>
    <div class="scene-orb orb-two" aria-hidden="true"></div>
    <span class="scene-spark spark-one" aria-hidden="true">✦</span>
    <span class="scene-spark spark-two" aria-hidden="true">✧</span>
    <span class="scene-spark spark-three" aria-hidden="true">✦</span>
    <div class="scene-decoration book-decoration" aria-hidden="true">📖</div>
    <div class="scene-decoration game-decoration" aria-hidden="true">🎮</div>
    <div class="scene-decoration robot-decoration" aria-hidden="true">🤖</div>
    <div class="scene-decoration cap-decoration" aria-hidden="true">🎓</div>

    <section class="auth-card" aria-labelledby="brand-title">
      <header class="auth-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path d="M8 17 20 9l12 6 12-6 12 8v34l-12-6-12 6-12-6-12 6z" fill="#7951ff"/>
            <path d="M20 17v28m24-28v28M21 25l4-4 4 4m10 0 4-4 4 4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="25" cy="31" r="3" fill="#fff"/><circle cx="43" cy="31" r="3" fill="#fff"/>
            <path d="M27 39q5 5 10 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <path d="M56 3v15m-4-11h8" stroke="#ffd854" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1 id="brand-title">Học Mà Chơi</h1>
          <p>Học thông minh hơn. Chơi vui hơn. Tiến bộ mỗi ngày.</p>
        </div>
      </header>

      <div class="xp-row" aria-label="Điểm kinh nghiệm hiện tại">
        <div class="xp-track"><span></span></div>
        <span class="xp-count"><span aria-hidden="true">⭐</span> 0 XP</span>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="Chọn đăng nhập hoặc tạo tài khoản">
        <button id="login-tab" class="auth-tab active" type="button" role="tab" aria-selected="true" aria-controls="auth-form" data-mode="login">
          <span aria-hidden="true">↪</span> Đăng nhập
        </button>
        <button id="register-tab" class="auth-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-form" data-mode="register">
          <span aria-hidden="true">♙+</span> Tạo tài khoản
        </button>
      </div>

      <div class="oauth-options">
        <button class="oauth-button" type="button" data-provider="google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.52h3.24c1.9-1.75 2.98-4.33 2.98-7.37Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.4l-3.24-2.52c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.58-4.13H3.08v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.42 13.91a6 6 0 0 1 0-3.82v-2.6H3.08a10 10 0 0 0 0 9.02l3.34-2.6Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.5 3.83 1.52l2.87-2.88C16.97 2.98 14.7 2 12 2a10 10 0 0 0-8.92 5.49l3.34 2.6C7.2 7.72 9.4 5.96 12 5.96Z"/></svg>
          Tiếp tục với Google
        </button>
        <button class="oauth-button" type="button" data-provider="github">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.75-1.32-3.75-1.32-.5-1.29-1.23-1.63-1.23-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.72 1.15 1.72 1.15 1 .1.61 2.05 3.5 1.45.1-.72.39-1.22.7-1.5-2.48-.28-5.08-1.25-5.08-5.55 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.1-1.45 3.05-1.15 3.05-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.31-2.6 5.26-5.09 5.54.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
          Tiếp tục với GitHub
        </button>
      </div>
      <p id="oauth-note" class="oauth-note">Đăng nhập Google/GitHub cần cấu hình OAuth Client ID và Secret trong `.env`.</p>
      <div class="form-divider"><span>hoặc bằng email</span></div>

      <form id="auth-form" novalidate>
        <div id="username-field" class="form-field" hidden>
          <label for="username"><span aria-hidden="true">♙</span> Tên người dùng</label>
          <input id="username" name="username" type="text" minlength="3" maxlength="30" autocomplete="username"
            placeholder="Ví dụ: nguyenminhan" pattern="[A-Za-z0-9._-]{3,30}">
          <small>3–30 ký tự: chữ, số, dấu chấm, gạch dưới hoặc gạch ngang.</small>
        </div>
        <div class="form-field">
          <label for="identity"><span aria-hidden="true">✉</span> <span id="identity-label">Email hoặc tên người dùng</span></label>
          <input id="identity" name="identity" type="text" autocomplete="username" required
            placeholder="Nhập email hoặc tên người dùng...">
        </div>
        <div id="email-field" class="form-field" hidden>
          <label for="email"><span aria-hidden="true">✉</span> Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="ban@example.com">
        </div>
        <div class="form-field">
          <label for="password"><span aria-hidden="true">▣</span> Mật khẩu</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128"
              required placeholder="Nhập mật khẩu...">
            <button id="toggle-password" class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false">◉</button>
          </div>
        </div>
        <label id="remember-row" class="remember-row">
          <input id="remember" name="remember" type="checkbox" checked>
          <span>Ghi nhớ đăng nhập trên thiết bị này</span>
        </label>
        <button id="submit-auth" class="submit-button" type="submit"><span aria-hidden="true">▶</span> Bắt đầu hành trình</button>
        <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
      </form>

      <footer class="auth-footer"><span class="ai-orb" aria-hidden="true">AI</span><span>AI đồng hành cá nhân hoá trải nghiệm học tập của bạn</span></footer>
    </section>
  </main>
</body>
</html>
